name: Validar plano

on:
  push:
  pull_request:

# O token do job só lê o repositório.
permissions:
  contents: read

# Um push novo na mesma ref cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions fixadas por commit; o Dependabot propõe as atualizações.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regras de pré-requisitos e portões
        run: python scripts/progresso.py --checar
      - name: Testes dos scripts
        run: pytest -q
      - name: Relatório de qualidade
        if: ${{ !cancelled() }}
        run: python scripts/qualidade.py >> "$GITHUB_STEP_SUMMARY"
